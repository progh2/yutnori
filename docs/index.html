<style>

<script>
  // ================= Yut throw model (plan.md 4.2) =================
  const MARKED_STICK = 0;
  const CATEGORY_INFO = {
    backdo: { result:'빽도', steps:-1, extraTurn:false, tone:'red' },
    do:     { result:'도',   steps: 1, extraTurn:false, tone:'' },
    gae:    { result:'개',   steps: 2, extraTurn:false, tone:'' },
    geol:   { result:'걸',   steps: 3, extraTurn:false, tone:'' },
    yut:    { result:'윷',   steps: 4, extraTurn:true,  tone:'jackpot' },
    mo:     { result:'모',   steps: 5, extraTurn:true,  tone:'jackpot' },
  };
  function rollSticks(){ return [0,1,2,3].map(() => Math.random() < 0.5); }
  function classifySticks(sticks){
    const flats = sticks.filter(Boolean).length;
    if (flats === 0) return 'mo';
    if (flats === 4) return 'yut';
    if (flats === 2) return 'gae';
    if (flats === 3) return 'geol';
    return sticks[MARKED_STICK] ? 'backdo' : 'do';
  }
  function rollYut(){
    const sticks = rollSticks();
    const category = classifySticks(sticks);
    return Object.assign({ sticks, category }, CATEGORY_INFO[category]);
  }
  function runProbabilityCheck(){
    const trials = 10000;
    const counts = {};
    Object.keys(CATEGORY_INFO).forEach(k => counts[k]=0);
    for (let i=0;i<trials;i++) counts[classifySticks(rollSticks())]++;
    console.log('윷 던지기 확률 검증 (' + trials + '회)');
    const expected = { backdo:1, do:3, gae:6, geol:4, yut:1, mo:1 };
    console.table(Object.keys(CATEGORY_INFO).map(k => ({
      결과: CATEGORY_INFO[k].result,
      기대확률: (expected[k]/16*100).toFixed(2)+'%',
      실측확률: (counts[k]/trials*100).toFixed(2)+'%',
      횟수: counts[k],
    })));
  }
  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
  function seededRandom(seed){
    let s = seed % 2147483647; if (s<=0) s += 2147483646;
    return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
  }
  function hashSeed(str){ let h=0; for (let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0; return Math.abs(h)||1; }
</script>

<script>
  // ================= Board graph (plan.md 4.1) =================
  const BOARD_S = 8;
  const BR=[4,4], BL=[-4,4], TL=[-4,-4], TR=[4,-4];
  function lerp2(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
  const CENTER=[0,0];
  const mid2 = c => lerp2(c, CENTER, 0.5);
  const M = { br:mid2(BR), bl:mid2(BL), tl:mid2(TL), tr:mid2(TR) };

  const NODE_POS = {};
  const sidesXZ = [[BR,BL],[BL,TL],[TL,TR],[TR,BR]];
  const outerXZ = [];
  sidesXZ.forEach(([from,to]) => { for (let i=0;i<5;i++) outerXZ.push(lerp2(from,to,i/5)); });
  outerXZ.forEach((p,i) => NODE_POS['o'+i] = p);
  NODE_POS['tlbr-1']=M.tl; NODE_POS['tlbr-2']=CENTER; NODE_POS['tlbr-3']=M.br;
  NODE_POS['bltr-1']=M.bl; NODE_POS['bltr-2']=CENTER; NODE_POS['bltr-3']=M.tr;
  NODE_POS['trbl-1']=M.tr; NODE_POS['trbl-2']=CENTER; NODE_POS['trbl-3']=M.bl;

  const NEXT = {};
  for (let i=0;i<20;i++) NEXT['o'+i] = 'o'+((i+1)%20);
  NEXT['tlbr-1']='tlbr-2'; NEXT['tlbr-2']='tlbr-3'; NEXT['tlbr-3']='o0';
  NEXT['bltr-1']='bltr-2'; NEXT['bltr-2']='bltr-3'; NEXT['bltr-3']='o15';
  NEXT['trbl-1']='trbl-2'; NEXT['trbl-2']='trbl-3'; NEXT['trbl-3']='o5';
  const PREV = {};
  Object.keys(NEXT).forEach(k => { PREV[NEXT[k]] = k; });
  const SHORTCUT_ENTRY = { o5:'bltr-1', o10:'tlbr-1', o15:'trbl-1' };
  const CORNER_IDS = ['o0','o5','o10','o15'];

  function walkPath(fromId, steps, useShortcut){
    const path = [];
    let cur = fromId;
    if (steps > 0){
      for (let i=0;i<steps;i++){
        const next = (i===0 && useShortcut && SHORTCUT_ENTRY[cur]) ? SHORTCUT_ENTRY[cur] : NEXT[cur];
        if (next === 'o0'){ path.push('FINISH'); return path; }
        cur = next; path.push(cur);
      }
    } else if (steps < 0){
      for (let i=0;i<-steps;i++){
        const prev = PREV[cur];
        if (!prev) break;
        cur = prev; path.push(cur);
      }
    }
    return path;
  }
</script>

<script>
  // ================= Audio (synthesized, no external files) =================
  let audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  const audio = { enabled:true, bgmTimer:null, bgmStep:0 };
  function toggleAudio(){
    audio.enabled = !audio.enabled;
    document.getElementById('audio-toggle').textContent = audio.enabled ? '🔊' : '🔇';
    if (audio.enabled) startBGM(); else stopBGM();
  }
  function playTone(freq, { duration=0.15, type='sine', gain=0.18, attack=0.005, decay=0.12, when=0 } = {}){
    if (!audio.enabled) return;
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime + when;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0+attack);
    g.gain.exponentialRampToValueAtTime(0.001, t0+attack+decay);
    osc.connect(g).connect(ctx.destination);
    osc.start(t0); osc.stop(t0+attack+decay+0.05);
  }
  function playNoiseBurst({ duration=0.08, gain=0.25, when=0, filterFreq=1800 } = {}){
    if (!audio.enabled) return;
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime + when;
    const size = Math.max(1, Math.floor(ctx.sampleRate*duration));
    const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<size;i++) data[i] = (Math.random()*2-1) * (1-i/size);
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const filter = ctx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=filterFreq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    src.connect(filter).connect(g).connect(ctx.destination);
    src.start(t0);
  }
  function playClack(){ [0,0.06,0.12,0.2].forEach((t,i) => playNoiseBurst({ when:t, duration:0.05, gain:0.22-i*0.02, filterFreq:1400+i*200 })); }
  function playDing(){ playTone(880,{type:'triangle',gain:0.2,decay:0.25}); playTone(1318.5,{type:'triangle',gain:0.14,decay:0.3,when:0.05}); }
  function playHop(){ playTone(520,{type:'square',gain:0.08,decay:0.06}); }
  function playClick(){ playTone(300,{type:'square',gain:0.05,decay:0.04}); }
  function playSad(){ playTone(300,{type:'sawtooth',gain:0.12,decay:0.18}); playTone(220,{type:'sawtooth',gain:0.12,decay:0.28,when:0.12}); }
  const BGM_NOTES = [392.0,440.0,523.25,587.33,659.25,587.33,523.25,440.0];
  function startBGM(){
    if (audio.bgmTimer || !audio.enabled) return;
    audio.bgmStep = 0;
    audio.bgmTimer = setInterval(() => {
      if (!audio.enabled) return;
      playTone(BGM_NOTES[audio.bgmStep % BGM_NOTES.length], { type:'sine', gain:0.045, decay:0.5, attack:0.02 });
      audio.bgmStep++;
    }, 420);
  }
  function stopBGM(){ clearInterval(audio.bgmTimer); audio.bgmTimer = null; }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ================= Shared 3D helpers =================
  function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }
  function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

  // A chibi-proportioned procedural character: big round head, small body, two
  // simple arms that can swing (for the throw + celebration poses), and a
  // swappable mouth so it can react with different emotions.
  //
  // Why not a real licensed model (Mixamo / VRoid / Quaternius etc.)? Claude
  // Artifacts can only load *scripts* from a small CDN allowlist — any other
  // resource (a .glb/.vrm file, a texture, anything fetched with XHR) is
  // blocked outright, from any host. The only way in would be to inline the
  // whole binary as a base64 data URI, and there's no reliable/legal way to
  // source and verify a specific model's license from inside this session.
  // So instead this character got a real upgrade: bigger head, actual arms
  // that animate, and a face that changes expression.
  function buildCharacter(color){
    const group = new THREE.Group();
    const bob = new THREE.Group();
    group.add(bob);

    const skin = new THREE.MeshStandardMaterial({ color, roughness:0.55 });
    const bodyMat = new THREE.MeshStandardMaterial({ color:0xfbf1d9, roughness:0.7 });

    const body = new THREE.Mesh(new THREE.SphereGeometry(0.27,18,14), bodyMat);
    body.position.y = 0.34;
    body.castShadow = true;
    bob.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 22, 18), skin);
    head.position.y = 0.72;
    head.castShadow = true;
    bob.add(head);

    const band = new THREE.Mesh(
      new THREE.TorusGeometry(0.41, 0.055, 10, 24),
      new THREE.MeshStandardMaterial({ color:0xfbf1d9, roughness:0.6 })
    );
    band.rotation.x = Math.PI/2;
    band.position.y = 0.88;
    bob.add(band);

    const eyeMat = new THREE.MeshStandardMaterial({ color:0x241a12, roughness:0.3 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05,10,10), eyeMat);
    eyeL.position.set(-0.14, 0.74, 0.35);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.14;
    bob.add(eyeL, eyeR);

    // swappable mouths (visibility toggled by emotion)
    const mouthMat = new THREE.MeshStandardMaterial({ color:0x241a12, roughness:0.3 });
    const mouthFlat = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.015,0.01), mouthMat);
    mouthFlat.position.set(0, 0.6, 0.39);
    const mouthSmile = new THREE.Mesh(new THREE.TorusGeometry(0.08,0.014,8,16,Math.PI), mouthMat);
    mouthSmile.rotation.z = Math.PI; mouthSmile.position.set(0,0.63,0.37);
    const mouthFrown = mouthSmile.clone(); mouthFrown.rotation.z = 0; mouthFrown.position.set(0,0.58,0.37);
    const mouthO = new THREE.Mesh(new THREE.TorusGeometry(0.045,0.02,8,14), mouthMat);
    mouthO.position.set(0,0.6,0.38);
    [mouthFlat, mouthSmile, mouthFrown, mouthO].forEach(m => bob.add(m));
    mouthFlat.visible = true; mouthSmile.visible = false; mouthFrown.visible = false; mouthO.visible = false;

    function shoulder(dx){
      const pivot = new THREE.Group();
      pivot.position.set(dx, 0.62, 0);
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.32,10), skin);
      arm.position.y = -0.16;
      arm.castShadow = true;
      pivot.add(arm);
      return pivot;
    }
    const armL = shoulder(-0.28), armR = shoulder(0.28);
    bob.add(armL, armR);
    armL.rotation.z = 0.25; armR.rotation.z = -0.25;

    return {
      group, bob, armL, armR,
      mouths: { flat:mouthFlat, smile:mouthSmile, frown:mouthFrown, o:mouthO },
      setMouth(name){ Object.values(this.mouths).forEach(m => m.visible=false); this.mouths[name].visible = true; },
    };
  }
</script>

<script>
  // ================= Main 3D scene: board, characters, sticks, camera =================
  const board3d = (function(){
    const container = document.getElementById('board-stage3d');
    let W = window.innerWidth, H = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a2e24);
    scene.fog = new THREE.Fog(0x0a2e24, 14, 26);
    const camera = new THREE.PerspectiveCamera(46, W/H, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(W,H);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
      W = window.innerWidth; H = window.innerHeight;
      camera.aspect = W/H; camera.updateProjectionMatrix();
      renderer.setSize(W,H);
    });

    scene.add(new THREE.AmbientLight(0xffe9c7,0.6));
    const sun = new THREE.DirectionalLight(0xfff3d6,0.85);
    sun.position.set(4,9,6); sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);
    scene.add(sun);

    const table = new THREE.Mesh(new THREE.CircleGeometry(11,48), new THREE.MeshStandardMaterial({ color:0x0e3c2f, roughness:0.95 }));
    table.rotation.x = -Math.PI/2; table.receiveShadow = true; scene.add(table);

    // ---- board path: corner-to-corner diagonals (fixed — previously only the
    // mid-to-mid segment was drawn, which is why the center X looked cut off)
    function lineFor(points, color, opacity){
      const pts = points.map(([x,z]) => new THREE.Vector3(x, 0.03, z));
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color, transparent:true, opacity: opacity===undefined?1:opacity });
      return new THREE.Line(geo, mat);
    }
    const ringPts = [];
    for (let i=0;i<=20;i++) ringPts.push(NODE_POS['o'+(i%20)]);
    scene.add(lineFor(ringPts, 0xf5e6bf));
    scene.add(lineFor([BR, M.br, CENTER, M.tl, TL], 0xf2b134, 0.9));
    scene.add(lineFor([BL, M.bl, CENTER, M.tr, TR], 0xf2b134, 0.9));

    // ---- terrain-style stepping-stone tiles (seeded per-node jitter so it
    // reads as organic/varied rather than a perfectly regular grid) ----
    function nodeTile(id){
      const isCorner = CORNER_IDS.includes(id);
      const isStart = id === 'o0';
      const isMid = id.endsWith('-1') || id.endsWith('-3');
      const rand = seededRandom(hashSeed(id));
      const baseR = isCorner ? 0.36 : (isMid ? 0.22 : 0.24);
      const r = baseR * (0.92 + rand()*0.16);
      const color = isStart ? 0xe0473a : (isCorner || isMid ? 0xf2b134 : 0xfbf1d9);
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(r, r*0.94, 0.12, 6),
        new THREE.MeshStandardMaterial({ color, roughness:0.6 })
      );
      const [x,z] = NODE_POS[id];
      mesh.position.set(x, 0.05 + rand()*0.035, z);
      mesh.rotation.y = rand()*Math.PI*2;
      mesh.rotation.x = (rand()-0.5)*0.06;
      mesh.rotation.z = (rand()-0.5)*0.06;
      mesh.receiveShadow = true;
      mesh.castShadow = false;
      return mesh;
    }
    const CENTER_ALIASES = ['tlbr-2','bltr-2','trbl-2'];
    Object.keys(NODE_POS).forEach(id => { if (!CENTER_ALIASES.includes(id)) scene.add(nodeTile(id)); });
    const centerMarker = new THREE.Mesh(
      new THREE.CylinderGeometry(0.32,0.3,0.12,8),
      new THREE.MeshStandardMaterial({ color:0xf2b134, roughness:0.5, emissive:0x3a2107, emissiveIntensity:0.15 })
    );
    centerMarker.position.set(0,0.06,0);
    scene.add(centerMarker);

    const flagPole = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.6,8), new THREE.MeshStandardMaterial({color:0x8a5a34}));
    flagPole.position.set(NODE_POS.o0[0], 0.3, NODE_POS.o0[1]);
    scene.add(flagPole);
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.2), new THREE.MeshStandardMaterial({ color:0xe0473a, side:THREE.DoubleSide }));
    flag.position.set(NODE_POS.o0[0]+0.15, 0.55, NODE_POS.o0[1]);
    scene.add(flag);

    // ---- characters / pieces ----
    const PLAYER_COLORS = [0xf2b134, 0xd94f8c];
    const pieceMeshes = [];
    function benchPos(owner, idx){ return [4+1.4+owner*1.2, 4-idx*1.0]; }
    function finishPos(owner, idx){ return [-(4+1.4+owner*1.2), -(4-idx*1.0)]; }
    for (let owner=0; owner<2; owner++){
      for (let idx=0; idx<2; idx++){
        const c = buildCharacter(PLAYER_COLORS[owner]);
        const [x,z] = benchPos(owner, idx);
        c.group.position.set(x,0,z);
        scene.add(c.group);
        pieceMeshes.push(Object.assign(c, { owner, idx, slot:'bench:'+owner+':'+idx }));
      }
    }

    // Small ring layout so pieces sharing a board node don't overlap.
    function ringOffsets(n){
      if (n<=1) return [[0,0]];
      const r = 0.24;
      return Array.from({length:n}, (_,i) => { const a=(i/n)*Math.PI*2; return [Math.cos(a)*r, Math.sin(a)*r]; });
    }
    function restackSlot(slot, exceptMesh){
      const occupants = pieceMeshes.filter(p => p.slot === slot);
      const offsets = ringOffsets(occupants.length);
      occupants.forEach((p,i) => {
        p.stackOffset = offsets[i];
        if (p !== exceptMesh && !/^(bench|finish):/.test(slot)){
          const [bx,bz] = NODE_POS[slot];
          p.group.position.set(bx+p.stackOffset[0], 0, bz+p.stackOffset[1]);
        }
      });
    }

    // ---- animation queue (drives camera tweens + piece hops from one loop) ----
    const animations = [];
    function animate(duration, onUpdate){
      return new Promise(resolve => { animations.push({ start: performance.now(), duration, onUpdate, resolve }); });
    }

    const OVERVIEW_POS = new THREE.Vector3(1, 13.5, 13);
    const OVERVIEW_LOOK = new THREE.Vector3(1, 0, 1.2);
    let lookAt = OVERVIEW_LOOK.clone();
    camera.position.copy(OVERVIEW_POS);
    camera.lookAt(lookAt);

    function tweenCamera(toPos, toLook, duration){
      const fromPos = camera.position.clone();
      const fromLook = lookAt.clone();
      return animate(duration, t => {
        const e = easeInOutCubic(t);
        camera.position.lerpVectors(fromPos, toPos, e);
        lookAt.lerpVectors(fromLook, toLook, e);
        camera.lookAt(lookAt);
      });
    }
    function piecesOf(owner){ return pieceMeshes.filter(p => p.owner===owner); }
    function focusPoint(owner){
      const mine = piecesOf(owner);
      const avg = new THREE.Vector3();
      mine.forEach(p => avg.add(p.group.position));
      avg.divideScalar(mine.length);
      return avg;
    }
    function toOverview(){ return tweenCamera(OVERVIEW_POS, OVERVIEW_LOOK, 850); }
    function focusOnPlayer(owner){
      const p = focusPoint(owner);
      const dir = owner===0 ? 1 : -1;
      const camPos = new THREE.Vector3(p.x*0.4+dir*1.6, 2.3, p.z*0.4+3.2);
      const look = new THREE.Vector3(p.x, 0.55, p.z);
      return tweenCamera(camPos, look, 750);
    }
    function focusOnPoint(worldPos, distance){
      const camPos = new THREE.Vector3(worldPos.x, worldPos.y + distance*0.55, worldPos.z + distance);
      return tweenCamera(camPos, worldPos.clone(), 550);
    }
    function screenPosFor(vec3){
      const v = vec3.clone().project(camera);
      const rect = renderer.domElement.getBoundingClientRect();
      return { x: rect.left + (v.x*0.5+0.5)*rect.width, y: rect.top + (-v.y*0.5+0.5)*rect.height };
    }

    // ---- manual right-drag orbit (adds/overrides on top of whatever the
    // scripted camera framing currently is, so free-look and the cinematic
    // tweens never fight each other) ----
    const spherical = new THREE.Spherical();
    let dragging = false, lastX=0, lastY=0;
    renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
    renderer.domElement.addEventListener('pointerdown', e => {
      if (e.button !== 2) return;
      dragging = true; lastX=e.clientX; lastY=e.clientY;
      spherical.setFromVector3(camera.position.clone().sub(lookAt));
    });
    window.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx=e.clientX-lastX, dy=e.clientY-lastY;
      lastX=e.clientX; lastY=e.clientY;
      spherical.theta -= dx*0.006;
      spherical.phi = Math.min(Math.PI*0.85, Math.max(Math.PI*0.12, spherical.phi - dy*0.006));
      const offset = new THREE.Vector3().setFromSpherical(spherical);
      camera.position.copy(lookAt).add(offset);
      camera.lookAt(lookAt);
    });
    window.addEventListener('pointerup', e => { if (e.button===2) dragging=false; });

    // ---- sticks thrown in-scene near the active character ----
    const STICK_LEN=0.5, STICK_W=0.075, STICK_H=0.06;
    function stickMats(){
      return [
        new THREE.MeshStandardMaterial({ color:0x8a5a34, roughness:0.8 }),
        new THREE.MeshStandardMaterial({ color:0x8a5a34, roughness:0.8 }),
        new THREE.MeshStandardMaterial({ color:0xfbf1d9, roughness:0.6 }),
        new THREE.MeshStandardMaterial({ color:0x6b4023, roughness:0.85 }),
        new THREE.MeshStandardMaterial({ color:0x8a5a34, roughness:0.8 }),
        new THREE.MeshStandardMaterial({ color:0x8a5a34, roughness:0.8 }),
      ];
    }
    const sticks = [0,1,2,3].map(i => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(STICK_W,STICK_H,STICK_LEN), stickMats());
      mesh.castShadow = true; mesh.visible = false;
      if (i === MARKED_STICK){
        const bandMesh = new THREE.Mesh(
          new THREE.CylinderGeometry(STICK_W*0.62, STICK_W*0.62, STICK_H+0.01, 14),
          new THREE.MeshStandardMaterial({ color:0xe0473a, roughness:0.6 })
        );
        bandMesh.rotation.x = Math.PI/2;
        mesh.add(bandMesh);
      }
      scene.add(mesh);
      return mesh;
    });
    const STICK_RESTS = [[-0.14,-0.07],[0.12,-0.08],[-0.11,0.09],[0.13,0.08]];

    async function throwSticksNear(spot){
      sticks.forEach(m => { m.visible = true; });
      const start = performance.now();
      const startState = sticks.map(() => ({
        x: spot.x + (Math.random()-0.5)*0.1,
        z: spot.z + (Math.random()-0.5)*0.1,
        y: spot.y,
        ry: Math.random()*Math.PI*2,
      }));
      return function reveal(sticksUp){
        const endState = sticksUp.map((isFlat,i) => {
          const [dx,dz] = STICK_RESTS[i];
          return { x: spot.x+dx, z: spot.z+dz, y: STICK_H/2, rx: isFlat?0:Math.PI, ry: Math.random()*Math.PI*2, spinX: 3+Math.floor(Math.random()*2) };
        });
        return animate(1000, t => {
          const ePos = easeOutCubic(t);
          const eRot = easeOutCubic(Math.min(1, t*1.15));
          sticks.forEach((mesh,i) => {
            const s = startState[i], e = endState[i];
            const arc = Math.sin(Math.PI*Math.min(1,t*1.05)) * (1-ePos*0.15);
            mesh.position.x = THREE.MathUtils.lerp(s.x, e.x, ePos);
            mesh.position.z = THREE.MathUtils.lerp(s.z, e.z, ePos);
            mesh.position.y = e.y + arc*0.55*(1-t*0.4);
            const spin = e.spinX*Math.PI*2*(1-eRot);
            mesh.rotation.x = e.rx + spin;
            mesh.rotation.y = THREE.MathUtils.lerp(s.ry, e.ry, eRot);
            if (t>=1){ mesh.position.set(e.x,e.y,e.z); mesh.rotation.set(e.rx,e.ry,0); }
          });
        });
      };
    }
    function hideSticks(){ sticks.forEach(m => m.visible = false); }

    // ---- piece movement: camera follows the piece hop by hop ----
    async function movePiece(piece, path, followCamera){
      let cur = piece.group.position.clone();
      for (const id of path){
        const target = id === 'FINISH'
          ? new THREE.Vector3(...(function(){ const [x,z]=finishPos(piece.owner,piece.idx); return [x,0,z]; })())
          : new THREE.Vector3(NODE_POS[id][0], 0, NODE_POS[id][1]);
        const from = cur.clone();
        const jobs = [animate(320, t => { piece.group.position.lerpVectors(from, target, easeOutCubic(t)); })];
        if (followCamera){
          const camTarget = new THREE.Vector3(target.x*0.35+2.2, 2.1, target.z*0.35+2.6);
          const lookTarget = new THREE.Vector3(target.x, 0.5, target.z);
          jobs.push(tweenCamera(camTarget, lookTarget, 320));
        }
        await Promise.all(jobs);
        playHop();
        cur = target;
        piece.slot = id === 'FINISH' ? ('finish:'+piece.owner+':'+piece.idx) : id;
        restackSlot(piece.slot, piece);
      }
    }

    // ---- bickering jitter when 2+ characters share a board node ----
    function applyBickerJitter(now){
      const bySlot = {};
      pieceMeshes.forEach(p => { if (!/^(bench|finish):/.test(p.slot)) (bySlot[p.slot] = bySlot[p.slot]||[]).push(p); });
      Object.values(bySlot).forEach(group => {
        if (group.length < 2) return;
        group.forEach((p,i) => {
          const phase = (i % 2 === 0) ? 0 : Math.PI;
          const j = Math.sin(now/160 + phase) * 0.05;
          const [bx,bz] = NODE_POS[p.slot];
          const [ox,oz] = p.stackOffset || [0,0];
          p.group.position.x = bx + ox + j;
          p.group.position.z = bz + oz + Math.cos(now/160+phase)*0.03;
        });
      });
    }

    function tick(now){
      requestAnimationFrame(tick);
      pieceMeshes.forEach((p,i) => { p.bob.position.y = 0.06*Math.sin(now/500 + i*1.3); });
      applyBickerJitter(now);
      for (let i=animations.length-1; i>=0; i--){
        const a = animations[i];
        const t = Math.min(1, (now-a.start)/a.duration);
        a.onUpdate(t);
        if (t>=1){ animations.splice(i,1); a.resolve(); }
      }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(tick);

    return {
      pieceMeshes, benchPos, finishPos, focusOnPlayer, focusOnPoint, toOverview,
      screenPosFor, movePiece, focusPoint, throwSticksNear, hideSticks, restackSlot,
    };
  })();
</script>

<script>
  // ================= Game state + turn flow =================
  const state = { players:null, currentPlayerIndex:0, history:[], pieces:[] };

  function showScreen(name){
    document.getElementById('screen-setup').hidden = name !== 'setup';
    document.getElementById('screen-game').hidden = name !== 'game';
  }

  function choosePlayers(humanCount){
    const types = humanCount===2 ? ['human','human'] : humanCount===1 ? ['human','bot'] : ['bot','bot'];
    state.players = types.map((type,i) => ({ id:i, type, name:'P'+(i+1) }));
    state.currentPlayerIndex = 0;
    state.history = [];
    state.pieces = [];
    for (let owner=0; owner<2; owner++) for (let idx=0; idx<2; idx++) state.pieces.push({ owner, idx, place:'start', nodeId:null });
    board3d.pieceMeshes.forEach(pm => {
      pm.slot = 'bench:'+pm.owner+':'+pm.idx;
      const [x,z] = board3d.benchPos(pm.owner, pm.idx);
      pm.group.position.set(x,0,z);
      pm.setMouth('flat');
      pm.armL.rotation.z = 0.25; pm.armR.rotation.z = -0.25;
    });
    renderPlayerBar();
    renderHistory();
    showScreen('game');
    startBGM();
  }

  function renderPlayerBar(){
    const bar = document.getElementById('player-bar');
    bar.innerHTML = '';
    state.players.forEach((p,i) => {
      if (i>0){ const vs=document.createElement('span'); vs.className='vs-divider'; vs.textContent='vs'; bar.appendChild(vs); }
      const badge = document.createElement('span');
      const isActive = i === state.currentPlayerIndex;
      badge.className = 'player-badge p'+i+(isActive?' active':'');
      badge.innerHTML = '<span class="avatar">'+(p.type==='human'?'🧑':'🤖')+'</span><span>'+(isActive?'<span class="turn-flag">▶</span>':'')+p.name+' · '+(p.type==='human'?'사람':'봇')+'</span>';
      bar.appendChild(badge);
    });
    document.getElementById('spectator-banner').hidden = !state.players.every(p => p.type==='bot');
  }
  function renderHistory(){
    document.getElementById('throw-history').innerHTML = state.history.map(r => '<span class="history-chip">'+r+'</span>').join('');
  }
  function pickPieceToMove(owner, steps){
    const mine = state.pieces.filter(p => p.owner===owner && p.place!=='finished');
    if (mine.length===0) return null;
    if (steps < 0){ const onboard = mine.filter(p => p.place==='onboard'); return onboard[0] || null; }
    const onboard = mine.filter(p => p.place==='onboard');
    return onboard[0] || mine[0];
  }
  function reactionEmojiFor(category){
    if (category==='mo' || category==='yut') return ['🤩','💃','🕺'][Math.floor(Math.random()*3)];
    if (category==='backdo') return ['😱','😭'][Math.floor(Math.random()*2)];
    if (category==='do') return '😐';
    return '🙂';
  }
  function setPieceExpression(pieceMesh, category){
    if (category==='mo' || category==='yut'){ pieceMesh.setMouth('o'); pieceMesh.armL.rotation.z=-2.4; pieceMesh.armR.rotation.z=2.4; }
    else if (category==='backdo'){ pieceMesh.setMouth('frown'); pieceMesh.armL.rotation.z=0.6; pieceMesh.armR.rotation.z=-0.6; }
    else if (category==='do'){ pieceMesh.setMouth('flat'); }
    else { pieceMesh.setMouth('smile'); }
  }
  function resetPieceExpression(pieceMesh){
    pieceMesh.setMouth('flat');
    pieceMesh.armL.rotation.z = 0.25; pieceMesh.armR.rotation.z = -0.25;
  }

  function showReaction(owner, emoji){
    const bubble = document.getElementById('reaction-bubble');
    const p = board3d.focusPoint(owner);
    const pos = board3d.screenPosFor(new THREE.Vector3(p.x, 1.3, p.z));
    bubble.style.left = pos.x+'px';
    bubble.style.top = pos.y+'px';
    bubble.textContent = emoji;
    bubble.classList.add('show');
  }
  function hideReaction(){ document.getElementById('reaction-bubble').classList.remove('show'); }

  function askShortcut(){
    const el = document.getElementById('shortcut-prompt');
    el.hidden = false;
    return new Promise(resolve => {
      function done(val){ el.hidden = true; yes.onclick=null; no.onclick=null; resolve(val); }
      const yes = document.getElementById('shortcut-yes'), no = document.getElementById('shortcut-no');
      yes.onclick = () => done(true);
      no.onclick = () => done(false);
    });
  }

  async function takeTurn(){
    const btn = document.getElementById('throw-btn');
    btn.disabled = true;
    const owner = state.currentPlayerIndex;
    const throwerPieces = board3d.pieceMeshes.filter(pm => pm.owner === owner);
    const thrower = throwerPieces[0];

    await board3d.focusOnPlayer(owner);
    playClack();

    // wind-up + throw arm animation
    const startArmL = thrower.armL.rotation.z, startArmR = thrower.armR.rotation.z;
    const spot = thrower.group.position.clone().add(new THREE.Vector3(0, 1.05, 0.35));
    const revealFn = await board3d.throwSticksNear(spot);
    await board3d.focusOnPoint(spot, 1.7);
    thrower.armL.rotation.z = -1.6; thrower.armR.rotation.z = 1.6;

    const outcome = rollYut();
    await revealFn(outcome.sticks);
    thrower.armL.rotation.z = startArmL; thrower.armR.rotation.z = startArmR;

    await wait(300);
    await board3d.focusOnPlayer(owner);
    board3d.hideSticks();

    document.getElementById('result-name').textContent = outcome.result;
    document.getElementById('result-name').className = 'result-name'+(outcome.tone?' tone-'+outcome.tone:'');
    document.getElementById('result-steps').textContent = (outcome.steps>0?'+':'')+outcome.steps+'칸 이동';
    document.getElementById('result-extra').hidden = !outcome.extraTurn;
    if (outcome.extraTurn) playDing();
    if (outcome.category==='backdo') playSad();

    state.history.unshift(outcome.result);
    state.history = state.history.slice(0,8);
    renderHistory();

    const piece = pickPieceToMove(owner, outcome.steps);
    showReaction(owner, reactionEmojiFor(outcome.category));
    setPieceExpression(thrower, outcome.category);

    if (piece){
      const pieceMesh = board3d.pieceMeshes.find(pm => pm.owner===piece.owner && pm.idx===piece.idx);
      let useShortcut = false;
      const fromId = piece.place==='onboard' ? piece.nodeId : 'o0';
      if (piece.place==='onboard' && outcome.steps>0 && SHORTCUT_ENTRY[piece.nodeId]) useShortcut = await askShortcut();
      const path = walkPath(fromId, outcome.steps, useShortcut);
      piece.place = 'onboard';
      await board3d.movePiece(pieceMesh, path, true);
      const last = path[path.length-1];
      if (last === 'FINISH') piece.place = 'finished'; else piece.nodeId = last;
    } else {
      await wait(500);
    }

    await wait(500);
    hideReaction();
    resetPieceExpression(thrower);
    await board3d.toOverview();

    state.currentPlayerIndex = 1-owner;
    renderPlayerBar();
    btn.disabled = false;
  }
</script>
