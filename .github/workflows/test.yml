name: rules

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rule tests
        run: node tests/rules.test.mjs
      - name: Cache tests
        run: node tests/sw.test.mjs
      - name: The deployed copy matches the source
        run: |
          for f in index.html sw.js; do
            if ! diff -q "game/$f" "docs/$f"; then
              echo "::error::docs/$f is out of date — copy game/$f over it"
              diff "game/$f" "docs/$f" | head -40
              exit 1
            fi
            echo "docs/$f matches game/$f"
          done
